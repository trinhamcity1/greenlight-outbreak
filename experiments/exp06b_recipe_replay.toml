# Step 2, rerun after the fix for the 2013 decline: columns with nothing to borrow are no longer near-unpenalised.
name = "exp06b_recipe_replay"
max_day = 90          # training horizon: the first 90 days
day_step = 2
test_from_day = 91    # default test window: records entered on days 91-182
test_to_day = 182
min_test = 200
min_test_deaths = 20
min_class = 10        # real-only arm needs this many deaths and survivors (as in Exp. 2/3)
lam0 = [1.0, 10.0, 100.0, 1000.0]   # borrowing strengths; chosen by leave-one-outbreak-out in the analysis
lam_free = "lam0"    # fix: columns with nothing to borrow get the same shrinkage as borrowed ones
max_fit_rows = 100000
n_jobs = 4

[override.covid_2020]  # same test month as Exp. 2/3 (July 2020) so the day-33 baseline is comparable
test_from_day = 126   # 2020-07-01 (day 0 = 2020-02-26)
test_to_day = 156     # 2020-07-31
