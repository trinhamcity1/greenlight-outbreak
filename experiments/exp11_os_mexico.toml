# Out-of-country test: OS replay (Exp. 8 code and settings) on Mexico COVID-19 2020 and 2021.
# Run with OUTBREAK_LIB=data/processed/library_intl.parquet. All settings fixed from the Brazil experiments.
name = "exp11_os_mexico"
kinship_run = "exp11_kinship_mexico"
only = ["covid_mx_2020", "covid_mx_2021"]
day0_mode = "threshold"
season_threshold = 20
max_day = 90
day_step = 2
test_from_day = 91
test_to_day = 182
min_test = 200
min_test_deaths = 20
min_class = 10
lam0 = 10.0
min_agree_kin = 3
agree_share = 0.8
stability_lag = 8
max_fit_rows = 100000
n_jobs = 2

[override.covid_mx_2020]  # July 2020, the same calendar month as the Brazil COVID 2020 test (day 0 = 2020-02-27)
test_from_day = 125
test_to_day = 155
